<p-contextMenu #contextMenuDT [model]="items"></p-contextMenu>

<div class="row">
  <p-table #dt [value]="data" [(selection)]="selectedData" dataKey="_id"
    styleClass="p-datatable-customers p-datatable-striped" [rowHover]="true" [scrollable]="false" [rows]="10"
    [showCurrentPageReport]="true" [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" [loading]="loading"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros" [filterDelay]="0"
    [paginatorDropdownAppendTo]="'body'" [globalFilterFields]="globalFilter">
    <ng-template pTemplate="caption">
      <div class="card-header table-header row">
        <div class="users-page-header__content">
          <div>
            <h1 class="users-page-header__title">Administración de participantes</h1>

            <p class="users-page-header__subtitle">
              Gestiona los participantes registrados en el derby.
            </p>
          </div>

          <div class="users-page-header__actions">
            <button type="button" (click)="showDialog()" class="btn users-page-header__primary-btn">
              <i class="pi pi-plus"></i>
              <span>Nuevo Participante</span>
            </button>

            <button type="file" class="btn users-page-header__secondary-btn">
              <i class="pi pi-upload"></i>
              <span>Importar</span>
            </button>
          </div>
        </div>

        <div class="users-page-header__search">
          <span class="p-input-icon-left users-page-header__search-box">
            <i class="pi pi-search"></i>

            <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
              placeholder="Buscar por nombre..." />
          </span>
        </div>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th class="th-custom" style="width: 3rem">
          <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
        </th>
        <th>
          <span class="p-column-title">Numero</span>
        </th>
        <th>
          <span class="p-column-title">Nombre</span>
        </th>
        <th class="th-custom" style="width: 8rem"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-data let-editing="true" let-ri="rowIndex">
      <tr class="p-selectable-row">
        <td>
          <p-tableCheckbox [value]="data"></p-tableCheckbox>
        </td>

        <td>
          {{ data.numero }}
        </td>

        <td [pEditableColumn]="data.nombre" pEditableColumnField="nombre">
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input pInputText type="text" [(ngModel)]="data.nombre" />
            </ng-template>
            <ng-template pTemplate="output">
              {{ data.nombre }}
            </ng-template>
          </p-cellEditor>
        </td>

        <td ngbDropdown>
          <button type="button" class="btn btn-danger btn-fab btn-icon btn-round" (click)="delete(data)">
            <i class="pi pi-trash"></i>
          </button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8">{{ emptyMessage }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="Agregar Participante" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
  <!-- <span class="p-text-secondary block mb-5">Agregar Participante</span> -->
  <form [formGroup]="roosterForm">
    <div class="flex align-items-center gap-3 mb-5">
      <label for="nombre" class="font-semibold w-6rem">Participante</label>
      <input pInputText id="nombre" formControlName="nombre" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex justify-content-end gap-2">
      <div class="row">
        <div class="col">
          <p-button label="Cancel" severity="secondary" (onClick)="closeDialog()" />
        </div>
        <div class="col">
          <p-button [disabled]="roosterForm.invalid" label="Save" (onClick)="saveRooster()" />
        </div>
      </div>
    </div>
  </form>
</p-dialog>
